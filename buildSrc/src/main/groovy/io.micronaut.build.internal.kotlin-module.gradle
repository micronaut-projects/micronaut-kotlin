plugins {
    id "io.micronaut.build.internal.kotlin-base"
    id "io.micronaut.build.internal.module"
    id("org.jetbrains.dokka")
}
ossIndexAudit {
        excludeCoordinates = [ // Ktor 2.x vulnerable versions
                "org.apache.tomcat:tomcat-catalina:9.0.89",
                "org.apache.tomcat:tomcat-coyote:9.0.117",
                "org.apache.tomcat.embed:tomcat-embed-core:9.0.89",
                "org.apache.tomcat:tomcat-juli:9.0.89",
                "org.eclipse.jetty:jetty-server:9.4.54.v20240208",
                "org.eclipse.jetty:jetty-http:9.4.54.v20240208",
                "org.eclipse.jetty:jetty-servlets:9.4.54.v20240208",
                "org.eclipse.jetty.http2:http2-common:9.4.54.v20240208",
        ]
}

tasks.matching { it.name.startsWith("dokkaGenerate") }.configureEach {
    dependsOn("kaptKotlin")
}
